{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1> {{question.question_text}} </h1>
    {% for choice in question.choice_set.all %}
    <div> {{choice.choice_text}} -- {{choice.votes}} -- vote{{choice.votes|pluralize}} </div>
    {% endfor %}<br>
    <a href="{% url 'polls:detail' question.id %}">Return to polling questions</a>
</body>
</html>
